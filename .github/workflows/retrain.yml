name: Retraining CI — MLflow Project

on:
  push:
    branches:
      - main
    paths:
      - "MLProject/**"
  repository_dispatch:
    types: [data_updated]
  workflow_dispatch:
    inputs:
      n_estimators:
        description: "Number of trees in RandomForest"
        required: false
        default: "200"
      max_depth:
        description: "Max depth per tree"
        required: false
        default: "15"

jobs:
  retrain:
    name: Retrain Model via MLflow Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLflow and dependencies
        run: |
          pip install mlflow>=2.10 scikit-learn>=1.3 pandas>=2.0 numpy>=1.24 \
            imbalanced-learn>=0.11 joblib>=1.3 matplotlib>=3.7 seaborn>=0.12

      - name: Run MLflow Project (with Quality Gate)
        id: train_step
        run: |
          cd MLProject
          # Set minimum accuracy threshold for production
          mlflow run . \
            --env-manager local \
            -P n_estimators=${{ github.event.inputs.n_estimators || '200' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '15' }} \
            -P min_accuracy=0.70

      - name: Acceptance Gate Check
        if: success()
        run: |
          echo "Decision: Model passed metrics threshold. Proceeding to Registry and Deployment."

      - name: Build and Push Docker Image (mlflow build-docker)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "Set DOCKER_USERNAME and DOCKER_PASSWORD in GitHub Secrets to enable docker push"
            exit 0
          fi
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

          # Find the MLmodel directory generated by mlflow run
          MODEL_PATH=$(find MLProject/mlruns -name "model" -type d | head -n 1)
          if [ -n "$MODEL_PATH" ]; then
            echo "Building docker image for model at $MODEL_PATH"
            mlflow models build-docker -m "$MODEL_PATH" -n "$DOCKER_USERNAME/pokerhand-model:latest"
            docker push "$DOCKER_USERNAME/pokerhand-model:latest"
          else
            echo "Model directory not found in mlruns (expected in CI). Skipping docker build gracefully."
            exit 0
          fi
